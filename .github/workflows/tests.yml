name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check code style
        run: vendor/bin/pint --test

  tests-sqlite:
    name: Tests (PHP ${{ matrix.php }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml selects an in-memory SQLite database.
      - name: Run tests
        run: php artisan test

  tests-mysql:
    name: Tests (PHP 8.4, MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: orderdesk_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Real environment variables win over the values in phpunit.xml.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: orderdesk_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate and seed a fresh database
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test

  docker-smoke:
    name: Docker image builds and serves the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/login > /dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Log in through the API with the demo user
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/v1/auth/token \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d '{"email":"demo@orderdesk.test","password":"password"}' | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -fsS http://localhost:8000/api/v1/customers -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' | grep -q '"data"'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  publish:
    name: Publish image to GHCR
    needs: [lint, tests-sqlite, tests-mysql, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository_owner }}/orderdesk:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orderdesk:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orderdesk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to home server
    needs: publish
    runs-on: [self-hosted, deploy]
    environment: production
    # Two deploys must never overlap, and a running deploy is never cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy
        run: deploy/deploy.sh
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
