# Production stack, run from /srv/apps/orderdesk by the deploy job (deploy/deploy.sh).
# IMAGE is set by the script to the exact tag being deployed; secrets come from .env.
services:
  app:
    image: ${IMAGE:?set by deploy.sh}
    ports:
      - "192.168.0.100:${HOST_PORT:-8082}:80"
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      SEED_DEMO_DATA: "false"
    volumes:
      - app_storage:/var/www/html/storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?}
      MYSQL_USER: ${DB_USERNAME:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  app_storage:
