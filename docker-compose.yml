# One command: docker compose up --build   ->   http://localhost:8000
# Demo-only credentials below; this stack is not meant for production.
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: OrderDesk
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: orderdesk
      DB_USERNAME: orderdesk
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      SEED_DEMO_DATA: "true"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orderdesk
      MYSQL_USER: orderdesk
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional: docker compose --profile tools up --build   ->   http://localhost:8080
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    environment:
      PMA_HOST: db
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  app_storage:
